name: track_flowers_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.0
# ==============================================================
# Dependencies
# ==============================================================
dependencies:
  cached_network_image: ^3.4.1

  cloud_firestore: ^6.6.0
  dio: ^5.9.2
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  firebase_analytics: ^12.4.3
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.3
  firebase_messaging: ^16.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^20.1.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  gap: ^3.0.1
  geocoding: ^4.0.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_maps_flutter: ^2.14.2
  googleapis_auth: ^2.3.2
  image: ^4.8.0
  image_picker: ^1.2.1
  injectable: ^2.7.1+2
  internet_connection_checker_plus: ^2.9.1+2
  json_annotation: ^4.11.0
  location: ^8.0.1
  logger: ^2.6.2
  lottie: ^3.3.2
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pinput: ^6.0.2
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.7
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  toastification: ^3.0.3

# ==============================================================
# Dev Dependencies
# ==============================================================
dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.11.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.12.0
  json_serializable: ^6.13.0
  mockito: ^5.6.3

# ==============================================================
# Flutter
# ==============================================================
flutter:
  uses-material-design: true

  # ---------- Assets ----------
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/translations/

  # ---------- Fonts ----------
  fonts:
    - family: RobotoEnglish
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700


